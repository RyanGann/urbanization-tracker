name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate readiness plan
        run: node scripts/validate-readiness-plan.mjs

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
        working-directory: apps/api

      - name: Install web dependencies
        run: npm ci

      - name: Lint API
        run: ruff check .
        working-directory: apps/api

      - name: Typecheck API
        run: mypy app
        working-directory: apps/api

      - name: Test API
        run: pytest
        working-directory: apps/api

      - name: Typecheck web
        run: npm --workspace apps/web run typecheck

      - name: Test web
        run: npm --workspace apps/web run test

      - name: Build web
        run: npm --workspace apps/web run build

      - name: Install Playwright browsers
        run: npm --workspace apps/web exec playwright install --with-deps chromium

      - name: Run Playwright smoke
        run: npm --workspace apps/web run e2e

      - name: Run production Playwright smoke
        run: npm --workspace apps/web run e2e:production

      - name: Test performance measurement counters
        run: node --test apps/web/e2e/performance/metrics.test.mjs scripts/performance/integration.test.mjs

      - name: Test bounded database readiness process
        run: node --test scripts/database-readiness.test.mjs

      - name: Run P02 intermediate catalog/development precheck
        run: node scripts/run-integration.mjs --suite performance --scenario catalog-development --profile desktop --smoke

      - name: Run real API and browser smoke
        run: node scripts/run-integration.mjs --suite live

      - name: Run U00 real filter scenario
        run: node scripts/run-integration.mjs --suite live --scenario u00-filters

      - name: Check explicit live and demo data modes
        run: node scripts/run-integration.mjs --suite api --scenario c01-data-modes

      - name: Check transactional PostgreSQL creation paths
        run: node scripts/run-integration.mjs --suite concurrency

      - name: Check source identity batches and copied restore
        run: node scripts/run-integration.mjs --suite api --scenario c03-source-identity

      - name: Check durable artifact manifests and publication gates
        run: node scripts/run-integration.mjs --suite api --scenario o01-artifacts

      - name: Check scoped original controls and last-good health
        run: node scripts/run-integration.mjs --suite api --scenario d01-scoped

      - name: Check agenda revisions and retained reviewer decisions
        run: node scripts/run-integration.mjs --suite api --scenario c04-agenda-revisions

      - name: Check durable environmental attestation, SQL fences and copied recovery
        run: node scripts/run-integration.mjs --suite api --scenario b02-provenance

      - name: Check public input limits and shared two-worker quotas
        run: node scripts/run-integration.mjs --suite api --scenario input-limits

      - name: Check environmental shadow imports and recovery
        run: node scripts/run-integration.mjs --suite live --scenario layer-import

      - name: Check immutable display builder and checkpoint recovery
        run: node scripts/run-integration.mjs --suite api --scenario display-builder

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          # Diagnostics only: private objects/staging, env files and DB dumps
          # are outside this explicit artifact allowlist.
          path: |
            tmp/integration/*/*.json
            tmp/integration/*/*.log
            tmp/integration/*/*.png
            tmp/integration/*/playwright/**
            tmp/integration/*/p04a/*.json
            tmp/integration/*/p04a/*.svg
            tmp/integration/*/p04a/*.png
            tmp/integration/*/p03/results.json
            tmp/integration/*/*-data/results.json
          if-no-files-found: ignore
