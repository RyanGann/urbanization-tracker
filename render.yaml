services:
  - type: web
    runtime: docker
    name: urbanization-tracker-api
    rootDir: apps/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urbanization-tracker-db
          property: connectionString
      - key: INGESTION_DATA_DIR
        value: /app/data
      - key: CORS_ORIGINS
        sync: false
      - key: REVIEWER_API_TOKEN
        generateValue: true
      - key: PHASE3_STORE_BACKEND
        value: postgres
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALERT_DELIVERY_ENABLED
        value: "false"
      - key: ALERT_DELIVERY_RATE_LIMIT
        value: "25"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"

  - type: web
    runtime: static
    name: urbanization-tracker-web
    buildCommand: npm ci && npm --workspace apps/web run build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: cron
    runtime: docker
    name: urbanization-tracker-alert-delivery
    rootDir: apps/api
    schedule: "*/15 * * * *"
    dockerCommand: python -m app.ingestion.cli send-alerts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urbanization-tracker-db
          property: connectionString
      - key: PHASE3_STORE_BACKEND
        value: postgres
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALERT_DELIVERY_ENABLED
        value: "false"
      - key: ALERT_DELIVERY_RATE_LIMIT
        value: "25"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"

databases:
  - name: urbanization-tracker-db
    databaseName: urbanization_tracker
    user: urbanization_tracker
