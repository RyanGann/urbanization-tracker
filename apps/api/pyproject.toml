[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanization-tracker-api"
version = "0.1.0"
description = "FastAPI backend for Urbanization Tracker"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "certifi>=2024.0",
  "email-validator==2.3.0",
  "fastapi>=0.111",
  "geoalchemy2>=0.15",
  "httpx>=0.27",
  "ijson==3.5.1",
  "psycopg[binary]>=3.1",
  "pymupdf>=1.24",
  "pyproj==3.8.0",
  "shapely==2.1.2",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["seed/*.json", "jurisdictions/*.json", "fixtures/*.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
