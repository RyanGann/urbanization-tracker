services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: integration
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U integration -d integration -Atqc \"SELECT 1 FROM pg_extension WHERE extname = 'postgis'\" | grep -qx 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - integration-db:/var/lib/postgresql/data
    networks:
      - private

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://integration:integration@db:5432/integration
      DATA_MODE: ${INTEGRATION_DATA_MODE:-live}
      PHASE3_STORE_BACKEND: ${INTEGRATION_PHASE3_STORE_BACKEND:-postgres}
      PROCESSED_STORE_BACKEND: ${INTEGRATION_PROCESSED_STORE_BACKEND:-postgres}
      HOSTED_INGESTION_ENABLED: "false"
      ALERT_DELIVERY_ENABLED: "false"
      REVIEWER_API_TOKEN: ${INTEGRATION_REVIEWER_TOKEN}
      CORS_ORIGINS: http://web
      INGESTION_DATA_DIR: ${INTEGRATION_INGESTION_DATA_DIR:-/var/empty-data}
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
      SMTP_FROM_EMAIL: integration@example.test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${INTEGRATION_ARTIFACT_DIR}/c01-data:/c01-data
    networks:
      - private

  api-gateway:
    image: nginx:1.27-alpine
    configs:
      - source: api-gateway-nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1::8000"
    networks:
      - private
      - edge

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.integration
      args:
        VITE_API_BASE_URL: http://api:8000
        VITE_PERFORMANCE_MARKS: ${P01_PERFORMANCE_MARKS:-false}
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1::80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - private

  mail:
    image: axllent/mailpit:v1.27.1
    networks:
      - private

  browser:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.browser.integration
    working_dir: /workspace/apps/web
    environment:
      LIVE_WEB_BASE_URL: http://web
      INTEGRATION_REVIEWER_TOKEN: ${INTEGRATION_REVIEWER_TOKEN}
      INTEGRATION_FIXTURE_TITLE: ${INTEGRATION_FIXTURE_TITLE}
      PLAYWRIGHT_OUTPUT_DIR: /artifacts/playwright/test-results
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: /artifacts/playwright/live.junit.xml
      P01_PERFORMANCE_PROFILE: ${P01_PERFORMANCE_PROFILE:-}
      P01_PERFORMANCE_SCENARIO: ${P01_PERFORMANCE_SCENARIO:-}
      P01_API_INTERNAL_URL: ${P01_API_INTERNAL_URL:-http://api:8000}
      P01_OUTPUT: ${P01_OUTPUT:-/artifacts/performance/unused.json}
      P01_SMOKE: ${P01_SMOKE:-false}
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ${INTEGRATION_ARTIFACT_DIR}:/artifacts
    networks:
      - private

volumes:
  integration-db:

networks:
  private:
    internal: true
  edge:

configs:
  api-gateway-nginx:
    file: ./apps/api/nginx.integration-gateway.conf
